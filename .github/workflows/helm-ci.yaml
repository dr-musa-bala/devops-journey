name: Helm CI/CD Pipeline

on:
  push:
    branches: [ "main", "module-11-helm" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write

jobs:
  lint-package-publish:
    name: Lint, Package, and Publish to GHCR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'latest'

      - name: Helm Lint Check
        run: |
          echo "==> Running helm lint..."
          helm lint sillypets-chart/

      - name: Dry-Run Template Test
        run: |
          echo "==> Testing template rendering..."
          helm template test-release sillypets-chart/ --debug

      - name: Package Helm Chart
        run: |
          echo "==> Packaging Helm chart..."
          mkdir -p ./dist
          helm package sillypets-chart/ --destination ./dist

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Chart to GHCR (OCI)
        if: github.event_name == 'push'
        run: |
          echo "==> Publishing Helm chart to GHCR..."
          PACKAGE_FILE=$(ls ./dist/*.tgz)
          helm push ${PACKAGE_FILE} oci://ghcr.io/${{ github.repository_owner }}/helm-charts
