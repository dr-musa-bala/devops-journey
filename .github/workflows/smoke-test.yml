name: Sanity & Smoke Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  smoke-test-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t sillypets-app:latest .

      - name: Export Docker image to tarball
        run: docker save sillypets-app:latest -o sillypets-app.tar

      # -------------------------------------------------------------
      # Aqua Security Trivy Vulnerability Scan
      # -------------------------------------------------------------
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          input: 'sillypets-app.tar'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
      # -------------------------------------------------------------
      # Container Health Check Verification
      # -------------------------------------------------------------
      - name: Spin Up Test Container
        run: docker run -d --name app-smoke-test -p 8000:80 sillypets-app:latest

      - name: Poll Health Endpoint
        run: |
          echo "Polling container health endpoint on port 8000..."
          for i in {1..10}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/ || true)
            echo "Attempt $i: Received HTTP $STATUS"
            if [ "$STATUS" -eq 200 ]; then
              echo "✅ Application health check passed!"
              exit 0
            fi
            sleep 3
          done
          echo "❌ Health check timed out or returned invalid status ($STATUS)"
          exit 1

      - name: Cleanup Test Container
        if: always()
        run: docker rm -f app-smoke-test || true  
       # -------------------------------------------------------------
      # Discord Notification
      # -------------------------------------------------------------
      - name: Send Discord Notification
        if: always()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          message: |
            📢 **Smoke Test Pipeline Run Complete**
            • **Status:** `${{ job.status }}`
            • **Branch:** `${{ github.ref_name }}`
            • **Commit:** `${{ github.event.head_commit.message }}`
            • **Repository:** `${{ github.repository }}` 

