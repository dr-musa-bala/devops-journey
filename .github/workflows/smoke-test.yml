name: Sanity & Smoke Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  smoke-test-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t sillypets-app:latest .

      - name: Export Docker image to tarball
        run: docker save sillypets-app:latest -o sillypets-app.tar

      # -------------------------------------------------------------
      # Aqua Security Trivy Vulnerability Scan
      # -------------------------------------------------------------
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          input: 'sillypets-app.tar'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
       # -------------------------------------------------------------
      # Discord Notification
      # -------------------------------------------------------------
      - name: Send Discord Notification
        if: always()
        uses: svenstaro/discord-action@v2
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          message: |
            📢 **Smoke Test Pipeline Run Complete**
            • **Status:** `${{ job.status }}`
            • **Branch:** `${{ github.ref_name }}`
            • **Commit:** `${{ github.event.head_commit.message }}`
            • **Repository:** `${{ github.repository }}` 

