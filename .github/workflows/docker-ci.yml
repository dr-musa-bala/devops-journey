name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/devops-journey:latest

  deploy:
    needs: build-and-push
    runs-on: self-hosted
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy Container Locally
        run: |
          echo "Starting continuous deployment to local environment..."
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/devops-journey:latest
          docker stop devops-app || true
          docker rm devops-app || true
          docker run -d --name devops-app -p 9090:80 ${{ secrets.DOCKERHUB_USERNAME }}/devops-journey:latest
          docker ps | grep devops-app

      - name: Post-Deployment Smoke Test
        run: |
          echo "Waiting 5 seconds for application startup..."
          sleep 5
          echo "Testing http://localhost:9090..."
          if curl -s --head http://localhost:9090 | grep "200 OK"; then
            echo "SUCCESS: Container is active and responding with HTTP 200 OK!"
          else
            echo "ERROR: Health check failed! Dumping container logs:"
            docker logs devops-app
            exit 1
          fi