name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/devops-journey:latest

  deploy:
    needs: build-and-push
    runs-on: self-hosted
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy Container with Automated Rollback
        run: |
          echo "Starting continuous deployment with automated rollback support..."

          # 1. Back up existing running container if present
          if docker ps -a --format '{{.Names}}' | grep -q "^devops-app$"; then
            echo "Backing up current active container to devops-app-backup..."
            docker stop devops-app || true
            docker rm -f devops-app-backup || true
            docker rename devops-app devops-app-backup
          fi

          # 2. Pull and start new container
          echo "Pulling latest image and starting container..."
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/devops-journey:latest
          docker run -d --name devops-app -p 9090:80 ${{ secrets.DOCKERHUB_USERNAME }}/devops-journey:latest

          # 3. Health check verification
          echo "Waiting 5 seconds for application startup..."
          sleep 5

          if curl -s --head http://localhost:9090 | grep -q "200 OK"; then
            echo "SUCCESS: Health check passed (HTTP 200 OK)."
            echo "Cleaning up backup container..."
            docker rm -f devops-app-backup || true
          else
            echo "ERROR: Health check failed!"
            echo "Dumping container logs:"
            docker logs devops-app
            
            echo "Initiating automated rollback..."
            docker rm -f devops-app || true
            
            if docker ps -a --format '{{.Names}}' | grep -q "^devops-app-backup$"; then
              docker rename devops-app-backup devops-app
              docker start devops-app
              echo "ROLLBACK COMPLETE: Restored previous working container."
            else
              echo "WARNING: No backup container found to restore."
            fi
            
            exit 1
          fi