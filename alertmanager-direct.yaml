global:
  resolve_timeout: 5m

route:
  group_by: ['namespace', 'alertname', 'pod']
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 1h
  receiver: 'slack-notifications'
  routes:
  - matchers:
    - name: alertname
      value: Watchdog
    receiver: 'null'
  - matchers:
    - name: severity
      value: "warning|critical"
      regex: true
    receiver: 'slack-notifications'

receivers:
- name: 'null'
- name: 'slack-notifications'
  slack_configs:
  - api_url: 'https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK_URL'
    channel: '#devops-alerts'
    send_resolved: true
    title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
    text: '*Alert:* {{ .CommonAnnotations.summary }} | *Description:* {{ .CommonAnnotations.description }} | *Severity:* {{ .CommonLabels.severity }} | *Pod:* {{ .CommonLabels.pod }}'
