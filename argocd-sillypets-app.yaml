apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sillypets-gitops
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/dr-musa-bala/devops-journey.git'
    targetRevision: main
    path: sillypets-chart
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
