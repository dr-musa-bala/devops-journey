apiVersion: v1
kind: Service
metadata:
  name: sillypets-service
  labels:
    app: sillypets                   # Added: Required for ServiceMonitor discovery
spec:
  type: NodePort
  selector:
    app: sillypets
  ports:
    - name: http                     # Added: Required by ServiceMonitor endpoints
      port: 80
      targetPort: 80
      nodePort: 30080
