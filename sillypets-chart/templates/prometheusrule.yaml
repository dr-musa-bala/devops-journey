apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: sillypets-alerts
  namespace: monitoring
  labels:
    release: prometheus-stack
spec:
  groups:
  - name: sillypets.alerts
    rules:
    # 1. Memory Usage Alert
    - alert: SillypetsHighMemoryUsage
      expr: sum(container_memory_working_set_bytes{namespace="default", pod=~"sillypets.*"}) by (pod) > 50000000
      for: 2m
      labels:
        severity: warning
        namespace: monitoring
      annotations:
        summary: 'High memory usage on pod {{ "{{" }} $labels.pod {{ "}}" }}'
        description: 'Pod {{ "{{" }} $labels.pod {{ "}}" }} is consuming over 50 MB of memory (current value: {{ "{{" }} $value {{ "}}" }} bytes).'

    # 2. CPU Usage Alert
    - alert: SillypetsHighCPUUsage
      expr: sum(rate(container_cpu_usage_seconds_total{pod=~"sillypets.*"}[5m])) by (pod) > 0.8
      for: 2m
      labels:
        severity: warning
        namespace: monitoring
      annotations:
        summary: 'High CPU usage on pod {{ "{{" }} $labels.pod {{ "}}" }}'
        description: 'Pod {{ "{{" }} $labels.pod {{ "}}" }} CPU usage is above 80% of a core over 5 minutes (current rate: {{ "{{" }} $value {{ "}}" }}).'

    # 3. Pod CrashLoop / Restart Alert
    - alert: SillypetsPodCrashLooping
      expr: sum(increase(kube_pod_container_status_restarts_total{pod=~"sillypets.*"}[15m])) by (pod) > 2
      for: 1m
      labels:
        severity: warning
        namespace: monitoring
      annotations:
        summary: 'Pod {{ "{{" }} $labels.pod {{ "}}" }} is restarting frequently'
        description: 'Pod {{ "{{" }} $labels.pod {{ "}}" }} has restarted more than 2 times in the last 15 minutes (restart increase: {{ "{{" }} $value {{ "}}" }}).'