apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: sillypets-alerts
  namespace: monitoring
  labels:
    release: prometheus-stack
spec:
  groups:
  - name: sillypets.alerts
    rules:
    - alert: SillypetsHighMemoryUsage
      expr: sum(container_memory_working_set_bytes{namespace="default", pod=~"sillypets.*"}) by (pod) > 1000000
      for: 2m
      labels:
        severity: warning
      annotations:
        summary: "High memory usage on pod {{ `{{ $labels.pod }}` }}"
        description: "Pod {{ `{{ $labels.pod }}` }} is consuming over 50 MB of memory (current value: {{ `{{ $value }}` }} bytes)."

    - alert: SillypetsHighMemoryUsage
      expr: sum(container_memory_working_set_bytes{namespace="default", pod=~"sillypets.*"}) by (pod) > 1
      for: 0s
      labels:
        severity: warning
      annotations:
        summary: "Sillypets pod high memory usage"
        description: "Pod memory usage is above 1 byte threshold."