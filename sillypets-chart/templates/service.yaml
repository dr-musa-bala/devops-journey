apiVersion: v1
kind: Service
metadata:
  name: sillypets-service
  labels:
    app: sillypets                   # Required for ServiceMonitor matching
spec:
  type: NodePort
  selector:
    app: sillypets
  ports:
    - name: http                     # Required by ServiceMonitor endpoint
      port: 80
      targetPort: 80
      nodePort: 30080
